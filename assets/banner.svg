<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c031a" />
      <stop offset="50%" stop-color="#15082e" />
      <stop offset="100%" stop-color="#2d1054" />
    </linearGradient>

    <!-- Glowing effect gradients -->
    <radialGradient id="glowLeft" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradient for Title -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f5f3ff" />
      <stop offset="70%" stop-color="#d8b4fe" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.03" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="300" fill="url(#bgGrad)" rx="15" />

  <!-- Background Glows -->
  <rect width="1200" height="300" fill="url(#glowLeft)" rx="15" />
  <rect width="1200" height="300" fill="url(#glowRight)" rx="15" />

  <!-- Background Grid -->
  <rect width="1200" height="300" fill="url(#grid)" rx="15" />

  <!-- Decorative elements: Abstract waves/lines -->
  <path d="M-50,220 C150,150 250,280 450,200 C650,120 750,240 950,160 C1050,120 1150,180 1250,140" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.15" />
  <path d="M-50,240 C200,180 300,290 500,190 C700,90 800,260 1000,170 C1100,125 1200,190 1250,155" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.1" />

  <!-- Sleek borders -->
  <rect width="1198" height="298" x="1" y="1" rx="14" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Centered Text Group -->
  <g transform="translate(600, 150)">
    <!-- Title with glowing shadow -->
    <text x="0" y="-15" text-anchor="middle" font-family="'Outfit', 'Montserrat', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="64" fill="url(#textGrad)" letter-spacing="4" filter="drop-shadow(0px 4px 12px rgba(124, 58, 237, 0.35))">
      SHIVANG SINGHAL
    </text>

    <!-- Subtitle -->
    <text x="0" y="35" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-weight="500" font-size="20" fill="#cbd5e1" letter-spacing="2">
      Aspiring AI &amp; Full-Stack Software Engineer
    </text>

    <!-- Minimalist decorative dot group -->
    <circle cx="-50" cy="70" r="3" fill="#8b5cf6" opacity="0.6" />
    <circle cx="-25" cy="70" r="3" fill="#a78bfa" opacity="0.6" />
    <circle cx="0" cy="70" r="4" fill="#ffffff" opacity="0.8" />
    <circle cx="25" cy="70" r="3" fill="#a78bfa" opacity="0.6" />
    <circle cx="50" cy="70" r="3" fill="#8b5cf6" opacity="0.6" />
  </g>
</svg>
